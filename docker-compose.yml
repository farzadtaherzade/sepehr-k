name: evm-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: evm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize schema on first start (runs only when the data dir is empty)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Nightly automated pg_dump backups.
  # Reuses the postgres image (no third-party image needed) and sleeps until
  # BACKUP_HOUR local time, so there is one less registry dependency to pull.
  postgres-backup:
    image: postgres:16-alpine
    container_name: evm-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}          # 02:00 local container time
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - ./backups:/backups
      - ./backup/run_backup.sh:/usr/local/bin/run_backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run_backup.sh"]

  directus:
    image: directus/directus:11
    container_name: evm-directus
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Directus itself ---
      KEY: "${DIRECTUS_KEY:-directus-key-change-me}"
      SECRET: "${DIRECTUS_SECRET:-directus-secret-change-me}"
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL:-admin@evm.local}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD:-Admin1234!}"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      WEBSOCKETS_ENABLED: "true"

      # --- Point Directus at the SAME Postgres instance/db as the platform tables ---
      # (No host-IP allowlist is needed: Directus connects to a database, not to a URL.)
      DB_CLIENT: "pg"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: "false"
    ports:
      - "${DIRECTUS_HOST_PORT:-8080}:8055"
    volumes:
      - directus_data:/directus/database
      # Local app extensions (Persian/Jalali display) persist on the host
      - ./directus/extensions:/directus/extensions
    healthcheck:
      # 127.0.0.1 (not localhost): busybox wget resolves localhost to ::1 and
      # Directus listens on IPv4 only, which kept the container "unhealthy".
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:8055/server/ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Persian (RTL) management web app over the EVM database.
  # Runs its own idempotent init (app tables + least-privilege `evm_app` role)
  # at startup, then connects to Postgres ONLY as `evm_app` — never as the owner.
  webapp:
    build: ./webapp
    image: evm-webapp:latest
    container_name: evm-webapp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Tehran}
      # Next standalone binds to $HOSTNAME; Docker sets it to the container id —
      # pin it so the server listens on all interfaces and the healthcheck works.
      HOSTNAME: 0.0.0.0
      # --- init-time connection (owner; used once at startup only) ---
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGADMIN_USER: ${POSTGRES_USER}
      PGADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      # --- runtime connection (least-privilege role, password synced at startup) ---
      EVM_APP_USER: evm_app
      EVM_APP_PASSWORD: ${EVM_APP_PASSWORD}
      # --- auth ---
      AUTH_SECRET: ${AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true only behind HTTPS
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # Bootstrap admin password — used ONLY when the user does not exist yet
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!2026}
      INIT_ON_START: "true"
    ports:
      - "${WEBAPP_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  directus_data:
